version: 2
platforms:
  - codex
  - opencode
  - claude-code
  - antigravity
  - cursor
truthmark:
  workspace: docs/truthmark
  generated:
    portal:
      enabled: false
frontmatter:
  required: []
  recommended:
    - status
    - last_reviewed
ignore:
  - node_modules/**
  - vendor/**
  - dist/**
  - build/**
  # Repo-local tooling for repo-local policy; no product truth owner by design.
  - scripts/repo-rules-block.ts
  - scripts/render-repo-rules.ts
